name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  toc-consistency:
    name: TOC consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify volumes are referenced from README
        run: |
          set -e
          for vol in biblia/vol-*.md; do
            base=$(basename "$vol")
            if ! grep -q "$base" README.md; then
              echo "ERROR: README.md no referencia $base"
              exit 1
            fi
          done
          echo "OK: todos los volúmenes están referenciados."
